<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareLoop · 工作人员工作台</title>
  <style>
    :root{--ink:#17312d;--muted:#667772;--paper:#f3f0e8;--card:#fffdf8;--teal:#075f59;--mint:#dff1e8;--coral:#f06449;--line:#d8e1da;--shadow:0 18px 50px rgba(23,49,45,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 8%,#dcefe6 0,transparent 24%),var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans SC",sans-serif}button,textarea{font:inherit}button{min-height:44px;border:0;border-radius:13px;padding:0 18px;cursor:pointer;font-weight:750}.app{max-width:1320px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:var(--teal);color:white;font-size:25px}.brand h1{margin:0;font-size:25px}.brand p{margin:0;color:var(--muted);font-size:14px}.tabs{display:flex;padding:4px;border-radius:16px;background:#e9e5dc}.tabs button{background:transparent;color:var(--muted)}.tabs button.active{background:white;color:var(--teal);box-shadow:0 3px 10px rgba(23,49,45,.08)}.grid{display:grid;grid-template-columns:minmax(280px,.7fr) minmax(420px,1.3fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.card h2{margin:0 0 5px}.muted{color:var(--muted)}.refresh-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.refresh-meta{color:var(--muted);font-size:13px}.session-list{display:grid;gap:10px;margin-top:18px}.session{width:100%;min-height:66px;text-align:left;background:white;border:1px solid var(--line)}.session.active{border-color:var(--teal);background:var(--mint)}.session.incoming{border-color:var(--coral);animation:incoming 1.2s ease}.status{display:inline-block;padding:4px 9px;border-radius:999px;background:#fff0cf;color:#755315;font-size:12px;font-weight:800}.notice{padding:13px 15px;border-radius:14px;background:var(--mint);margin:17px 0}textarea{display:block;width:100%;min-height:150px;padding:14px;border:1px solid var(--line);border-radius:15px;resize:vertical}.actions{display:flex;gap:10px;margin-top:14px}.primary{background:var(--teal);color:white}.secondary{background:var(--mint);color:var(--ink)}button:disabled{cursor:not-allowed;opacity:.48}.hidden{display:none!important}.task-list{display:grid;gap:11px;margin:18px 0}.task{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px;border:1px solid var(--line);border-radius:16px;background:white}.kitchen-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.empty{padding:18px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);text-align:center}@keyframes incoming{0%{transform:translateY(-5px);background:#fff2dc;box-shadow:0 0 0 5px rgba(240,100,73,.12)}100%{transform:none;background:white;box-shadow:none}}@media(max-width:800px){.app{padding:14px}.top{align-items:flex-start;flex-direction:column}.grid,.kitchen-grid{grid-template-columns:1fr}.tabs{width:100%}.tabs button{flex:1}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand"><div class="logo">🧑‍🍳</div><div><h1>CareLoop 工作人员工作台</h1><p>工作人员协助、后厨制作与配送任务</p></div></div><nav class="tabs" aria-label="工作区"><button class="active" data-view="assist">顾客协助</button><button data-view="kitchen">后厨 / 传送带</button></nav></header>
  <section id="assistView" class="grid">
    <div class="card"><h2>待协助会话</h2><p class="muted">选择顾客发来的会话进行处理。</p><div class="refresh-row"><button id="refreshSessions" class="secondary">↻ 刷新会话</button><span id="refreshStatus" class="refresh-meta" role="status" aria-live="polite">正在加载…</span><span id="liveStatus" class="refresh-meta" role="status" aria-live="polite">实时连接中…</span></div><div id="sessions" class="session-list"></div></div>
    <div class="card"><h2>修正点餐内容</h2><p class="muted">修正只会交回顾客确认，不会直接下单。</p><div id="sessionNotice" class="notice">请先选择一个待协助会话</div><label for="staffCorrection"><b>核对后的菜品、口味和桌号</b></label><textarea id="staffCorrection" placeholder="例如：我要一份少盐的红烧肉，A12桌" disabled></textarea><div class="actions"><button id="claim" class="primary" disabled>认领会话</button><button id="staffSubmit" class="secondary" disabled>提交修正，等待顾客确认</button></div></div>
  </section>
  <section id="kitchenView" class="kitchen-grid hidden">
    <div class="card"><h2>后厨任务</h2><div id="kitchenTasks" class="task-list"></div><button id="refreshKitchen" class="secondary">刷新任务</button></div>
    <div class="card"><h2>传送带任务</h2><div id="conveyorTasks" class="task-list"></div><p class="muted">配送目标以订单选择的固定桌号为准。</p></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const state={sessions:[],selected:null,sessionRequest:0};
async function api(path,options={}){const response=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data}
function sessionStatus(value){return {NEEDS_STAFF:'待认领',CLAIMED:'已认领',SUBMITTED:'已提交'}[value]||value}
function pendingSessions(){return state.sessions.filter(session=>session.status!=='SUBMITTED')}
function renderSessions(){const pending=pendingSessions();$('sessions').innerHTML=pending.length?pending.map(session=>`<button class="session ${state.selected?.id===session.id?'active':''}" data-session="${session.id}"><b>${session.transcript||'（顾客未提供文字）'}</b><br><span class="status">${sessionStatus(session.status)}</span></button>`).join(''):'<div class="empty">暂无待协助会话</div>';document.querySelectorAll('[data-session]').forEach(button=>button.onclick=()=>selectSession(button.dataset.session))}
function upsertSession(session,{announce=false}={}){if(!session?.id)return;const existing=state.sessions.findIndex(item=>item.id===session.id);const isNew=existing<0;if(isNew)state.sessions.push(session);else state.sessions[existing]=session;state.sessions.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));if(state.selected?.id===session.id)state.selected=session;renderSessions();if(state.selected)selectSession(state.selected.id,{preserveDraft:true});if(announce&&isNew){$('refreshStatus').textContent='● 刚刚收到新会话 · '+pendingSessions().length+' 个待处理';const node=document.querySelector(`[data-session="${session.id}"]`);node?.classList.add('incoming');window.setTimeout(()=>node?.classList.remove('incoming'),1400)}}
function selectSession(id,{preserveDraft=false}={}){state.selected=state.sessions.find(session=>session.id===id);renderSessions();$('sessionNotice').textContent=`会话 ${state.selected.id} · ${sessionStatus(state.selected.status)}`;$('staffCorrection').disabled=false;if(!preserveDraft)$('staffCorrection').value=state.selected.transcript||'';$('claim').disabled=state.selected.status!=='NEEDS_STAFF';$('staffSubmit').disabled=state.selected.status!=='CLAIMED'}
async function loadSessions({interactive=false,automatic=false}={}){const requestId=++state.sessionRequest;const button=$('refreshSessions');if(interactive){button.disabled=true;button.textContent=automatic?'↻ 正在同步…':'↻ 正在刷新…';$('refreshStatus').textContent=automatic?'收到顾客求助，正在自动刷新…':'正在获取最新会话…'}try{const sessions=await api('/staff/sessions?_='+Date.now(),{cache:'no-store'});if(requestId!==state.sessionRequest)return;state.sessions=sessions.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));if(state.selected){const current=state.sessions.find(session=>session.id===state.selected.id);if(current)state.selected=current;else state.selected=null}renderSessions();if(state.selected)selectSession(state.selected.id,{preserveDraft:true});const time=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());$('refreshStatus').textContent=`${automatic?'已自动刷新':'已刷新'} ${time} · ${pendingSessions().length} 个待处理`}catch(error){if(requestId===state.sessionRequest)$('refreshStatus').textContent=(automatic?'自动刷新失败：':'刷新失败：')+error.message}finally{if(interactive){button.disabled=false;button.textContent='↻ 刷新会话'}}}
$('refreshSessions').onclick=()=>loadSessions({interactive:true});
$('claim').onclick=async()=>{if(!state.selected)return;try{await api('/staff/sessions/'+state.selected.id+'/claim',{method:'POST'});$('sessionNotice').textContent='已认领，请核对并修正点餐内容';await loadSessions()}catch(error){$('sessionNotice').textContent=error.message}};
$('staffSubmit').onclick=async()=>{if(!state.selected)return;const transcript=$('staffCorrection').value.trim();if(!transcript){$('sessionNotice').textContent='请填写修正后的点餐内容';return}$('staffSubmit').disabled=true;try{await api('/staff/sessions/'+state.selected.id,{method:'PATCH',body:JSON.stringify({transcript,status:'SUBMITTED'})});$('sessionNotice').textContent='修正已提交，等待顾客确认';state.selected=null;$('staffCorrection').value='';$('staffCorrection').disabled=true;$('claim').disabled=true;await loadSessions()}catch(error){$('sessionNotice').textContent=error.message;$('staffSubmit').disabled=false}};
async function refreshTasks(){const [kitchen,conveyor]=await Promise.all([api('/kitchen/tasks'),api('/conveyor/tasks')]);$('kitchenTasks').innerHTML=kitchen.length?kitchen.map(task=>`<div class="task"><span><b>${task.id}</b><br><small>${task.status}</small></span>${task.status==='QUEUED'?`<button class="primary" data-start="${task.id}">开始制作</button>`:task.status==='COOKING'?`<button class="secondary" data-complete="${task.id}">制作完成</button>`:''}</div>`).join(''):'<div class="empty">暂无后厨任务</div>';$('conveyorTasks').innerHTML=conveyor.length?conveyor.map(task=>`<div class="task"><span><b>${task.trayCode} → ${task.tableNumber}</b><br><small>${task.status}</small></span>${task.status==='READY'?`<button class="primary" data-dispatch="${task.id}">开始配送</button>`:task.status==='IN_PROGRESS'?`<button class="secondary" data-deliver="${task.id}">确认送达</button>`:''}</div>`).join(''):'<div class="empty">暂无传送带任务</div>';document.querySelectorAll('[data-start]').forEach(button=>button.onclick=async()=>{await api('/kitchen/tasks/'+button.dataset.start+'/start',{method:'POST'});refreshTasks()});document.querySelectorAll('[data-complete]').forEach(button=>button.onclick=async()=>{await api('/kitchen/tasks/'+button.dataset.complete+'/complete',{method:'POST'});refreshTasks()});document.querySelectorAll('[data-dispatch]').forEach(button=>button.onclick=async()=>{await api('/conveyor/tasks/'+button.dataset.dispatch+'/dispatch',{method:'POST'});refreshTasks()});document.querySelectorAll('[data-deliver]').forEach(button=>button.onclick=async()=>{await api('/conveyor/tasks/'+button.dataset.deliver+'/deliver',{method:'POST'});refreshTasks()})}
$('refreshKitchen').onclick=refreshTasks;
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));const kitchen=button.dataset.view==='kitchen';$('assistView').classList.toggle('hidden',kitchen);$('kitchenView').classList.toggle('hidden',!kitchen);if(kitchen)refreshTasks()});
function connectRealtime(){const protocol=location.protocol==='https:'?'wss:':'ws:';const socket=new WebSocket(protocol+'//'+location.host+'/ws');socket.onopen=()=>{$('liveStatus').textContent='● 实时接收已连接'};socket.onmessage=event=>{try{const message=JSON.parse(event.data);if(message.type==='voice.staff_requested'){upsertSession(message.payload?.staffSession,{announce:true});loadSessions({interactive:true,automatic:true})}if(message.type==='staff.session_updated')upsertSession(message.payload,{announce:true});if(message.type==='kitchen.task_created'||message.type==='conveyor.task_created')refreshTasks()}catch(_error){}};socket.onclose=()=>{$('liveStatus').textContent='实时连接已断开，正在重连…';window.setTimeout(connectRealtime,2000)}}
loadSessions();connectRealtime();
</script></body></html>
