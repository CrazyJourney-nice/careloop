<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareLoop - 智能社区食堂点餐系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .order-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .order-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    .status-dot { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  </style>
</head>
<body class="bg-gray-50">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-white border-r border-gray-200 flex flex-col">
      <div class="p-6 border-b">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-2xl">🍲</div>
          <div>
            <h1 class="text-2xl font-bold text-gray-900">CareLoop</h1>
            <p class="text-xs text-gray-500">试点食堂 v0.1.0</p>
          </div>
        </div>
      </div>

      <nav class="flex-1 p-4 space-y-1">
        <a href="#" onclick="switchTab(0)" class="nav-link flex items-center gap-3 px-4 py-3 rounded-2xl bg-emerald-50 text-emerald-700 font-medium">
          <i class="fa-solid fa-house w-5"></i>
          <span>我的订单</span>
        </a>
        <a href="#" onclick="switchTab(1)" class="nav-link flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-600 hover:bg-gray-50">
          <i class="fa-solid fa-utensils w-5"></i>
          <span>点餐菜单</span>
        </a>
        <a href="#" onclick="switchTab(2)" class="nav-link flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-600 hover:bg-gray-50">
          <i class="fa-solid fa-table w-5"></i>
          <span>餐桌管理</span>
        </a>
        <a href="#" onclick="switchTab(3)" class="nav-link flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-600 hover:bg-gray-50">
          <i class="fa-solid fa-kitchen-cabinet w-5"></i>
          <span>后厨看板</span>
        </a>
        <a href="#" onclick="switchTab(4)" class="nav-link flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-600 hover:bg-gray-50">
          <i class="fa-solid fa-robot w-5"></i>
          <span>AICAN 模拟</span>
        </a>
      </nav>

      <div class="p-4 border-t">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-gray-200 rounded-2xl flex items-center justify-center text-2xl">👴</div>
          <div class="flex-1">
            <div class="font-medium text-sm">李阿姨</div>
            <div class="text-xs text-gray-500">13800139000</div>
          </div>
          <button onclick="logout()" class="text-red-500 hover:text-red-600">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <!-- Header -->
      <header class="h-16 bg-white border-b px-8 flex items-center justify-between">
        <div class="flex items-center gap-8">
          <h2 id="page-title" class="text-xl font-semibold text-gray-800">我的订单</h2>
          <div class="flex gap-6 text-sm">
            <a onclick="switchTab(0)" class="cursor-pointer text-emerald-600 font-medium">订单详情</a>
            <a onclick="switchTab(0)" class="cursor-pointer text-gray-400">历史订单</a>
          </div>
        </div>
        
        <div class="flex items-center gap-6">
          <div onclick="showVoiceDemo()" class="flex items-center gap-2 bg-emerald-100 hover:bg-emerald-200 px-5 py-2 rounded-2xl cursor-pointer transition-colors">
            <i class="fa-solid fa-microphone text-emerald-600"></i>
            <span class="text-sm font-medium text-emerald-700">语音点餐</span>
          </div>
          <div class="flex items-center gap-2 bg-blue-100 hover:bg-blue-200 px-5 py-2 rounded-2xl cursor-pointer transition-colors" onclick="openTableMap()">
            <i class="fa-solid fa-map-location-dot text-blue-600"></i>
            <span class="text-sm font-medium text-blue-700">实时餐桌地图</span>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="flex-1 overflow-auto p-8" id="content-area">
        <!-- Will be loaded by JS -->
      </div>
    </div>

    <!-- Right Sidebar - Order Summary -->
    <div class="w-80 bg-white border-l border-gray-200 flex flex-col">
      <div class="p-6 border-b">
        <div class="flex justify-between items-center">
          <h3 class="font-semibold text-gray-700">本单总价</h3>
          <div id="total-price" class="text-3xl font-bold text-emerald-600">¥0.00</div>
        </div>
      </div>

      <div class="flex-1 p-6 overflow-auto" id="order-items-list">
        <!-- Dynamic -->
      </div>

      <div class="p-6 border-t mt-auto">
        <button onclick="confirmOrder()" 
                class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-3xl text-lg transition-all active:scale-95">
          确认订单并付款
        </button>
        <div class="text-center text-xs text-gray-400 mt-4">支持微信/支付宝/现金</div>
      </div>
    </div>
  </div>

  <!-- Voice Demo Modal -->
  <div id="voice-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl max-w-md w-full mx-4 overflow-hidden">
      <div class="p-8 text-center">
        <div class="mx-auto w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center text-5xl mb-6">🎤</div>
        <h3 class="text-2xl font-semibold mb-2">语音点餐</h3>
        <p class="text-gray-500 mb-8">请说出您的需求...</p>
        
        <div onclick="startVoiceRecognition()" 
             class="w-32 h-32 mx-auto bg-red-500 hover:bg-red-600 rounded-full flex items-center justify-center cursor-pointer transition-all active:scale-95 shadow-xl">
          <i class="fa-solid fa-microphone text-white text-6xl"></i>
        </div>
        
        <div id="voice-result" class="mt-10 text-lg font-medium min-h-[60px] text-gray-600"></div>
      </div>
    </div>
  </div>

  <script>
    // Tailwind script already loaded via CDN
    function switchTab(tab) {
      const titles = ['我的订单', '点餐菜单', '餐桌管理', '后厨看板', 'AICAN 模拟'];
      document.getElementById('page-title').textContent = titles[tab];
      loadContent(tab);
    }

    function loadContent(tab) {
      const area = document.getElementById('content-area');
      let html = '';
      
      if (tab === 0) { // My Orders
        html = `
          <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-3xl overflow-hidden shadow">
              <div class="p-6 border-b flex items-center justify-between">
                <div>
                  <div class="font-medium">订单 #CL001-2026-08-14-ABC123</div>
                  <div class="text-xs text-gray-500">李阿姨 • A12 桌</div>
                </div>
                <div class="px-4 py-1 bg-emerald-100 text-emerald-700 text-xs font-medium rounded-2xl">已确认</div>
              </div>
              
              <div class="p-6">
                <div class="flex gap-6">
                  <div>
                    <div class="text-xs text-gray-500">宫保鸡丁 x1</div>
                    <div class="text-xs text-gray-500">可乐 x2</div>
                  </div>
                  <div class="ml-auto text-right">
                    <div class="font-semibold">¥1,428.00</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (tab === 1) { // Menu
        html = `
          <div class="grid grid-cols-2 gap-4">
            ${['宫保鸡丁','清蒸鱼','红烧肉','酸辣土豆丝','可乐','番茄炒蛋','西兰花炒虾仁','凉拌木耳','椰子水','芒果冰'].map(name => `
              <div onclick="addToOrder('${name}')" 
                   class="bg-white rounded-3xl p-6 cursor-pointer hover:shadow-xl transition-all">
                <div class="h-32 bg-gradient-to-br from-emerald-100 to-teal-100 rounded-2xl flex items-center justify-center text-6xl mb-4">🍛</div>
                <div class="font-medium">${name}</div>
                <div class="text-emerald-600 font-semibold">¥5.2</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tab === 2) { // Tables
        html = `
          <div class="grid grid-cols-5 gap-4">
            ${Array(20).fill(0).map((_, i) => `
              <div onclick="selectTable(${i+1})" 
                   class="bg-white rounded-3xl p-6 text-center cursor-pointer hover:border-emerald-300 border border-transparent">
                <div class="text-4xl mb-3">🪑</div>
                <div class="font-mono font-bold text-xl">A0${i+1}</div>
                <div class="text-xs text-emerald-600">空桌</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tab === 3) { // Kitchen
        html = `
          <div class="space-y-4">
            <div class="bg-white rounded-3xl p-6 flex items-center gap-6">
              <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-3xl">🍛</div>
              <div class="flex-1">
                <div class="font-medium">宫保鸡丁 x1</div>
                <div class="text-sm text-gray-500">订单 #CL001-2026-08-14-ABC123</div>
              </div>
              <div class="px-6 py-2 bg-emerald-100 text-emerald-700 text-xs font-medium rounded-2xl">已上菜</div>
            </div>
            <div class="bg-white rounded-3xl p-6 flex items-center gap-6">
              <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-3xl">🥢</div>
              <div class="flex-1">
                <div class="font-medium">清蒸鱼 x1</div>
                <div class="text-sm text-gray-500">订单 #CL002-2026-08-14-DEF456</div>
              </div>
              <div class="px-6 py-2 bg-emerald-100 text-emerald-700 text-xs font-medium rounded-2xl">制作中</div>
            </div>
          </div>
        `;
      } else if (tab === 4) { // AICAN
        html = `
          <div class="text-center py-20">
            <div class="inline-flex items-center justify-center w-40 h-40 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full text-white text-7xl mb-8">🤖</div>
            <h3 class="text-2xl font-semibold mb-2">AICAN 机器人模拟</h3>
            <p class="text-gray-500">餐桌 A12 订单已分配托盘 12345</p>
            <div class="mt-12 inline-flex items-center gap-2 bg-white shadow rounded-3xl px-8 py-4">
              <div class="w-4 h-4 bg-green-500 rounded-full animate-ping"></div>
              <span class="text-sm font-medium">配送中 → 桌号 A12</span>
            </div>
          </div>
        `;
      }
      
      area.innerHTML = html;
    }

    let currentOrder = {
      items: [],
      total: 0
    };

    function addToOrder(name) {
      const prices = { '宫保鸡丁': 6.8, '清蒸鱼': 9.2, '红烧肉': 7.5, '酸辣土豆丝': 4.2, '可乐': 3.8, '番茄炒蛋': 5.2, '西兰花炒虾仁': 8.9, '凉拌木耳': 3.5, '椰子水': 4.2, '芒果冰': 5.2 };
      const price = prices[name];
      currentOrder.items.push({ name, price });
      currentOrder.total = currentOrder.items.reduce((sum, item) => sum + item.price, 0);
      
      document.getElementById('total-price').textContent = `¥${currentOrder.total.toFixed(2)}`;
      const area = document.getElementById('order-items-list');
      area.innerHTML = currentOrder.items.map(item => `
        <div class="flex justify-between py-3 border-b last:border-0">
          <div>${item.name}</div>
          <div class="font-medium">¥${item.price}</div>
        </div>
      `).join('');
    }

    function confirmOrder() {
      if (currentOrder.items.length === 0) return alert('请先添加菜品');
      alert('✅ 订单已提交！支付成功（Demo模式）\n\n订单已进入后厨制作流程');
      currentOrder = { items: [], total: 0 };
      document.getElementById('total-price').textContent = '¥0.00';
      document.getElementById('order-items-list').innerHTML = '';
    }

    function showVoiceDemo() {
      document.getElementById('voice-modal').classList.remove('hidden');
      document.getElementById('voice-result').textContent = '正在聆听...';
      setTimeout(() => {
        document.getElementById('voice-result').innerHTML = `
          <span class="text-emerald-600">宫保鸡丁 x1 + 可乐 x2</span>
          <div class="text-xs text-gray-400 mt-2">语音识别成功 ✓</div>
        `;
        setTimeout(() => {
          document.getElementById('voice-modal').classList.add('hidden');
          addToOrder('宫保鸡丁');
          addToOrder('可乐');
        }, 800);
      }, 1800);
    }

    function openTableMap() {
      alert('📍 实时餐桌地图已打开\n\n所有餐桌状态已更新\nA12 桌：已占用（您）\nB05 桌：空桌 3 张');
    }

    function selectTable(num) {
      alert(`✅ 选中餐桌 A0${num}\n\n订单已分配至此桌号`);
    }

    function logout() {
      if (confirm('确定退出系统？')) {
        window.location.reload();
      }
    }

    // Init
    window.onload = () => {
      switchTab(0);
      loadContent(0);
    };
  </script>
</body>
</html>
