<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CareLoop v0.1.0</title>
  <style>
    :root{--ink:#193b3b;--muted:#60736e;--paper:#f7f4ec;--card:#fffdf8;--teal:#0f6864;--mint:#dceee5;--coral:#d85b49;--yellow:#f2c45a;--line:#d8e3dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Noto Sans SC",sans-serif}button,input,select{font:inherit}button{min-height:56px;border:0;border-radius:16px;padding:0 20px;cursor:pointer;font-weight:700}.app{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.brand{display:flex;gap:14px;align-items:center}.logo{display:grid;place-items:center;width:60px;height:60px;border-radius:20px;background:var(--teal);color:white;font-size:32px}.brand h1{margin:0;font-size:32px}.brand p{margin:0;color:var(--muted)}.modes{display:flex;gap:8px;flex-wrap:wrap}.modes button{background:white;border:2px solid var(--line)}.modes button.active{background:var(--teal);color:white}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 22px #193b3b0d}.card h2,.card h3{margin-top:0}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dish{display:flex;justify-content:space-between;align-items:center;gap:12px;border:2px solid var(--line);background:white;padding:16px;border-radius:18px}.dish button,.primary{background:var(--teal);color:white}.secondary{background:var(--mint);color:var(--ink)}.danger{background:#ffe1da;color:#8d2e22}.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.table{background:white;border:2px solid var(--line);padding:12px;border-radius:14px;text-align:center;min-height:72px}.table.selected{border-color:var(--teal);background:var(--mint)}.order-line,.task{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.total{font-size:28px;font-weight:800;color:var(--teal)}.voice{display:grid;gap:12px}.voice textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:16px;padding:14px}.voice button{background:var(--coral);color:white}.notice{padding:14px;border-radius:16px;background:#fff4cc;color:#74550d}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--mint);font-weight:700}.hidden{display:none}.wide{grid-column:1/-1}.muted{color:var(--muted)}.route{height:100px;border-radius:20px;background:repeating-linear-gradient(90deg,#286e68 0 26px,#3f8980 27px 34px);position:relative;margin:12px 0}.tray{position:absolute;top:25px;left:45%;background:white;padding:10px 14px;border-radius:12px;animation:move 4s infinite alternate ease-in-out}@keyframes move{to{left:78%}}@media(max-width:900px){.app{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.menu{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.table-grid{grid-template-columns:repeat(3,1fr)}button{min-height:60px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand"><div class="logo">🍲</div><div><h1>CareLoop</h1><p>社区食堂智能点餐 · v0.1.0 Demo</p></div></div><div class="modes" role="tablist"><button class="active" data-mode="customer">顾客点餐</button><button data-mode="proxy">为他人点餐</button><button data-mode="staff">工作人员</button><button data-mode="kitchen">后厨 / 传送带</button></div></header>
  <section id="customerView" class="grid">
    <div class="card"><h2 id="greeting">李阿姨，今天想吃什么？</h2><p class="muted">选择菜品，或使用语音生成订单预览。语音结果必须确认后才会提交。</p><div id="menu" class="menu"></div><h3>选择固定餐桌</h3><div id="tables" class="table-grid"></div></div>
    <aside class="card"><h2>订单预览</h2><div id="orderLines"><p class="muted">还没有选择菜品</p></div><p>总计 <span id="total" class="total">¥0.00</span></p><label>支付方式 <select id="payment"><option value="CASH">线下现金</option><option value="WECHAT">微信（模拟）</option><option value="ALIPAY">支付宝（模拟）</option></select></label><button id="submit" class="primary" style="width:100%;margin-top:16px">预览并确认订单</button><div id="orderStatus" class="notice hidden" style="margin-top:12px"></div></aside>
    <div class="card voice wide"><h2>语音点餐</h2><textarea id="voiceText" placeholder="例如：我要一份少盐的红烧肉，送到 A12 桌"></textarea><div><button id="voicePreview">🎙 识别并生成预览</button> <button id="staffHelp" class="secondary">需要工作人员帮助</button></div><div id="voiceResult" class="notice hidden"></div></div>
  </section>
  <section id="staffView" class="grid hidden"><div class="card"><h2>工作人员协助台</h2><p>查看识别失败的文本，修正菜品、口味和桌号后提交。</p><div class="notice">当前会话：<b id="staffSession">等待接管</b></div><button id="claim" class="primary" style="margin-top:16px">认领会话</button></div><div class="card"><h2>协助说明</h2><p>工作人员修改后的订单仍需用户确认；未确认的代点订单不会进入后厨。</p><button class="secondary" data-mode="customer">返回顾客端</button></div></section>
  <section id="kitchenView" class="grid hidden"><div class="card"><h2>后厨任务</h2><div id="kitchenTasks"></div><button id="refreshKitchen" class="secondary">刷新任务</button></div><div class="card"><h2>传送带模拟器</h2><div id="conveyorTasks"></div><div class="route"><div class="tray">🍱 TRAY · A12</div></div><p class="muted">状态由服务端任务推进，配送目标必须是合法桌号。</p></div></section>
  <section class="card" style="margin-top:18px"><h2>当前订单状态</h2><div id="currentOrder"><p class="muted">尚未创建订单</p></div></section>
</main><script>
const state={menu:[],tables:[],items:[],tableId:'TBL-A12',order:null};
const $=id=>document.getElementById(id); const money=v=>'¥'+(v/100).toFixed(2);
async function api(path,options={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function renderMenu(){ $('menu').innerHTML=state.menu.map(d=>`<div class="dish"><span><b>${d.name}</b><br><small>${money(d.priceCents)} · ${d.supportedModifiers?.slice(0,3).join('、')||'可选口味'}</small></span><button data-add="${d.id}">加入</button></div>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const d=state.menu.find(x=>x.id===b.dataset.add);state.items.push({dishId:d.id,dishName:d.name,quantity:1,modifiers:[]});renderOrder()})}
function renderTables(){ $('tables').innerHTML=state.tables.map(t=>`<button class="table ${state.tableId===t.id?'selected':''}" data-table="${t.id}">${t.tableNumber}<br><small>${t.status==='AVAILABLE'?'空桌':'占用'}</small></button>`).join('');document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{state.tableId=b.dataset.table;renderTables()})}
function renderOrder(){const total=state.items.reduce((s,i)=>s+(state.menu.find(d=>d.id===i.dishId)?.priceCents||0)*i.quantity,0);$('total').textContent=money(total);$('orderLines').innerHTML=state.items.length?state.items.map((i,n)=>`<div class="order-line"><span>${i.dishName} × ${i.quantity}<br><small>${i.modifiers.join('、')||'默认口味'}</small></span><button class="danger" data-remove="${n}">移除</button></div>`).join(''):'<p class="muted">还没有选择菜品</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.items.splice(Number(b.dataset.remove),1);renderOrder()})}
function renderOrderStatus(o){$('currentOrder').innerHTML=`<div class="order-line"><span><b>${o.orderNumber}</b><br>桌号：${state.tables.find(t=>t.id===o.tableId)?.tableNumber||'A12'}</span><span class="status">${o.status}</span></div><p>${o.items.map(i=>`${i.dishNameSnapshot} × ${i.quantity} ${i.modifiers?.join('、')||''}`).join(' · ')}</p>`}
async function load(){state.menu=await api('/canteens/CAN001/menu');state.tables=await api('/canteens/CAN001/tables');renderMenu();renderTables();renderOrder();const existing=await api('/orders');if(existing.length){state.order=existing[existing.length-1];renderOrderStatus(state.order)}}
$('voicePreview').onclick=async()=>{try{const d=await api('/orders/voice-preview',{method:'POST',body:JSON.stringify({text:$('voiceText').value,language:'zh-CN'})});$('voiceResult').classList.remove('hidden');$('voiceResult').textContent=`识别结果：${d.intent.intent}，置信度 ${(d.intent.confidence*100).toFixed(0)}%。请检查并点击确认，系统不会自动下单。`;if(d.intent.intent==='ADD_ITEM'){d.intent.items.forEach(i=>{const dish=state.menu.find(x=>x.name===i.dishQuery);if(dish)state.items.push({dishId:dish.id,dishName:dish.name,quantity:i.quantity,modifiers:i.modifiers})});renderOrder()}if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance('请检查订单内容后确认'));}catch(e){$('voiceResult').classList.remove('hidden');$('voiceResult').textContent=e.message}}
$('staffHelp').onclick=async()=>{const d=await api('/staff/sessions',{method:'POST',body:JSON.stringify({transcript:$('voiceText').value})});$('voiceResult').classList.remove('hidden');$('voiceResult').textContent='已提交工作人员协助请求：'+d.id;document.querySelector('[data-mode="staff"]').click()};
$('claim').onclick=()=>{$('staffSession').textContent='已认领 · 可修改订单';};
$('submit').onclick=async()=>{try{const preview=await api('/orders/preview',{method:'POST',body:JSON.stringify({items:state.items,tableId:state.tableId})});const ok=confirm(`请确认订单：${preview.items.map(i=>i.dishNameSnapshot+' × '+i.quantity).join('、')}，共 ${money(preview.totalCents)}，${preview.tableNumber}桌`);if(!ok)return;const o=await api('/orders',{method:'POST',body:JSON.stringify({items:state.items,tableId:state.tableId,paymentMethod:$('payment').value,source:'SELF'})});const confirmed=await api('/orders/'+o.id+'/confirm',{method:'POST',body:JSON.stringify({paymentMethod:$('payment').value})});state.order=confirmed;localStorage.setItem('careloop:lastOrder',JSON.stringify(confirmed));renderOrderStatus(confirmed);$('orderStatus').classList.remove('hidden');$('orderStatus').textContent='订单已确认并进入后厨制作。';}catch(e){$('orderStatus').classList.remove('hidden');$('orderStatus').textContent=e.message}};
async function refreshTasks(){const ks=await api('/kitchen/tasks');$('kitchenTasks').innerHTML=ks.length?ks.map(t=>`<div class="task"><span>${t.id}<br><small>${t.status}</small></span><span>${t.status==='QUEUED'?`<button data-start="${t.id}" class="primary">开始制作</button>`:t.status==='COOKING'?`<button data-complete="${t.id}" class="secondary">制作完成</button>`:t.status}</span></div>`).join(''):'<p class="muted">暂无任务</p>';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{await api('/kitchen/tasks/'+b.dataset.start+'/start',{method:'POST'});refreshTasks()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=async()=>{await api('/kitchen/tasks/'+b.dataset.complete+'/complete',{method:'POST'});refreshTasks()});const cs=await api('/conveyor/tasks');$('conveyorTasks').innerHTML=cs.length?cs.map(t=>`<div class="task"><span>${t.trayCode} → ${t.tableNumber}<br><small>${t.status}</small></span><span>${t.status==='READY'?`<button class="primary" data-dispatch="${t.id}">开始配送</button>`:t.status==='IN_PROGRESS'?`<button class="secondary" data-deliver="${t.id}">已送达</button>`:t.status}</span></div>`).join(''):'<p class="muted">暂无传送带任务</p>';document.querySelectorAll('[data-dispatch]').forEach(b=>b.onclick=async()=>{await api('/conveyor/tasks/'+b.dataset.dispatch+'/dispatch',{method:'POST'});refreshTasks()});document.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=async()=>{await api('/conveyor/tasks/'+b.dataset.deliver+'/deliver',{method:'POST'});refreshTasks()})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const mode=b.dataset.mode;$('customerView').classList.toggle('hidden',mode==='staff'||mode==='kitchen');$('staffView').classList.toggle('hidden',mode!=='staff');$('kitchenView').classList.toggle('hidden',mode!=='kitchen');if(mode==='kitchen')refreshTasks()});load();
</script></body></html>
